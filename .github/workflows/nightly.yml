name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Engine benchmarks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: perf-baseline.json
          key: perf-baseline-${{ github.run_id }}
          restore-keys: perf-baseline-
      - run: python3 scripts/perf.py --engine-only --baseline perf-baseline.json --out perf-report.json
      - run: cp perf-report.json perf-baseline.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: perf-baseline.json
          key: perf-baseline-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report
          path: perf-report.json
          retention-days: 90
