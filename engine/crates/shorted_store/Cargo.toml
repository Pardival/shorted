[package]
name = "shorted_store"
description = "Project folder, autosave journal, snapshots, atomic writes and schema migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
shorted_core = { path = "../shorted_core" }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = "1.29.0"
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
sha2 = "0.10.9"
tempfile = "3.27.0"
uuid = "1.29.0"
