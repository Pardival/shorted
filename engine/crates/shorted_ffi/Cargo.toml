[package]
name = "shorted_ffi"
description = "The only crate exposed to Dart: coarse-grained API, async functions, event streams."
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
flutter_rust_bridge = "=2.13.0"
shorted_core = { path = "../shorted_core" }
shorted_store = { path = "../shorted_store" }
shorted_media = { path = "../shorted_media" }
shorted_render = { path = "../shorted_render" }
shorted_audio = { path = "../shorted_audio" }
shorted_playback = { path = "../shorted_playback" }
shorted_transcribe = { path = "../shorted_transcribe" }
shorted_analysis = { path = "../shorted_analysis" }
shorted_ai = { path = "../shorted_ai" }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
regex = "1.13.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
wgpu = "30.0.1"
uuid = { version = "1.29.0", features = ["v7"] }
time = { version = "0.3.55", features = ["formatting"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
cpal = "0.18.2"
objc2-core-foundation = "0.3.2"
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["IOSurfaceRef"] }
rtrb = "0.4.1"
