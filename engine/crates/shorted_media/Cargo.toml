[package]
name = "shorted_media"
description = "MediaBackend trait and per-platform decode, encode, mux, probe and proxies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
thiserror = "2.0.21"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-foundation", "objc2-core-video"] }
objc2-core-foundation = "0.3.2"
objc2-core-media = { version = "0.3.2", features = ["objc2-core-video"] }
objc2-core-video = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-foundation = "0.3.2"
objc2-io-surface = "0.3.2"
