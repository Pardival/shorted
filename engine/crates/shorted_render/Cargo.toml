[package]
name = "shorted_render"
description = "wgpu compositor shared by preview and export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cosmic-text = "0.19.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pollster = "1.0.1"
shorted_core = { path = "../shorted_core" }
shorted_media = { path = "../shorted_media" }
thiserror = "2.0.21"
wgpu = "30.0.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.5"
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["IOSurfaceRef"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "objc2-io-surface"] }
