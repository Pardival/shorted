[package]
name = "shorted_core"
description = "Project model, commands, undo stack and timeline evaluation. Pure: no I/O, no threads, no GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
proptest = "1.12.0"
